worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Never record OIDC callback query strings, cookies, or Authorization headers.
    log_format safe '$remote_addr $request_method $uri $status';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream verdant_api {
        zone verdant_api 64k;
        server api:8000 resolve;
    }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        location = /health/web { access_log off; return 200 'ready\n'; }
        location ~ ^/(auth|api|health|mcp)(/|$) {
            proxy_pass http://verdant_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}

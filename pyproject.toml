[project]
name = "verdant-platform"
version = "0.1.0"
description = "Dataset-first internal ML platform"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "authlib>=1.9.1,<2",
  "boto3>=1.40,<2",
  "fastapi>=0.115,<1",
  "fastmcp>=4.1,<5",
  "httpx>=0.28,<1",
  "opentelemetry-api>=1.30,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pyjwt[crypto]>=2.15.1,<3",
  "sqlalchemy>=2.0,<2.1",
  "starsessions>=2.2,<3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "opentelemetry-sdk>=1.30,<2",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verdant"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

name: Python platform
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: verdant-test-only
          POSTGRES_DB: verdant_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      VERDANT_DATABASE_URL: postgresql+psycopg://postgres:verdant-test-only@localhost:5432/verdant_ci_test
      VERDANT_TEST_DATABASE_URL: postgresql+psycopg://postgres:verdant-test-only@localhost:5432/verdant_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked toolchain
        run: |
          python -m pip install uv==0.8.16
          uv sync --frozen
      - name: Static checks
        run: |
          uv run ruff check src migrations tests
          uv run ruff format --check src migrations tests
      - name: PostgreSQL lifecycle and contracts
        run: |
          uv run pytest -q
          uv run alembic check

services:
  database:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    environment:
      POSTGRES_PASSWORD: browser-e2e-database
      POSTGRES_DB: verdant_browser_e2e_test
    ports: ['127.0.0.1:19032:5432']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30
  auth:
    image: quay.io/keycloak/keycloak@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    command: [start-dev, --import-realm]
    environment:
      KC_HOSTNAME: http://127.0.0.1:19081
      KC_HTTP_PORT: '19081'
      KC_HEALTH_ENABLED: 'true'
    ports: ['127.0.0.1:19081:19081']
    volumes: ['./realm.json:/opt/keycloak/data/import/realm.json:ro']
    healthcheck:
      test: [CMD, bash, -ec, 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3; grep -q "200 OK" <&3']
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 20s
  objects:
    image: chrislusf/seaweedfs@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    command: [mini, '-dir=/data', '-ip=objects', '-ip.bind=0.0.0.0', '-s3.port=8333', '-s3.config=/run/objects.json', '-bucket=verdant-artifacts', '-s3.autoCreateBucket=false', '-webdav=false', '-admin.ui=false', '-s3.port.iceberg=0', '-s3.port.lance=0', '-master.telemetry=false', '-master.volumeSizeLimitMB=64', '-master.volumePreallocate=false', '-volume.max=16']
    ports: ['127.0.0.1:19033:8333']
    volumes: ['./objects.json:/run/objects.json:ro']
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:9333/cluster/status']
      interval: 2s
      timeout: 3s
      retries: 30

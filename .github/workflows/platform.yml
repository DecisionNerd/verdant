name: Python platform
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: verdant-test-only
          POSTGRES_DB: verdant_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      VERDANT_DATABASE_URL: postgresql+psycopg://postgres:verdant-test-only@localhost:5432/verdant_ci_test
      VERDANT_TEST_DATABASE_URL: postgresql+psycopg://postgres:verdant-test-only@localhost:5432/verdant_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked toolchain
        run: |
          python -m pip install uv==0.8.16
          uv sync --locked --group workflows
      - name: Static checks
        run: |
          uv run --locked --group workflows ruff check src migrations tests scripts infrastructure/compose
          uv run --locked --group workflows ruff format --check src migrations tests scripts infrastructure/compose
      - name: PostgreSQL lifecycle and contracts
        run: |
          uv run --locked --group workflows pytest -q
          uv run --locked --group workflows alembic check
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --filter @verdant/workspace... --frozen-lockfile
      - name: Build and typecheck workspace
        run: pnpm --filter @verdant/workspace build
      - name: Workspace refresh and authorization regressions
        run: pnpm --filter @verdant/workspace test

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate local inputs and validate root Compose
        run: |
          python3 infrastructure/compose/bootstrap.py
          python3 infrastructure/compose/bootstrap.py
          docker compose config --quiet
          python3 infrastructure/compose/bootstrap-workflows.py
          python3 infrastructure/compose/bootstrap-workflows.py
          docker compose --env-file infrastructure/compose/.local/compose.env --env-file infrastructure/compose/.local/workflows.env -f infrastructure/compose/compose.yaml -f infrastructure/compose/workflows.yaml config --quiet

  lifecycle-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked application and browser test dependencies
        run: |
          python -m pip install uv==0.8.16
          uv sync --locked --group workflows
          pnpm install --filter @verdant/workspace... --frozen-lockfile
          pnpm --filter @verdant/workspace exec playwright install --with-deps chromium
      - name: Real authenticated two-session lifecycle
        run: pnpm --filter @verdant/workspace test:e2e
      - name: Preserve bounded browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-browser-evidence
          path: |
            apps/workspace/test-results/**/receipt.json
            apps/workspace/test-results/**/*.png
          if-no-files-found: ignore

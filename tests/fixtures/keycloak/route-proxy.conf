server {
    listen 18081;
    server_name auth.127.0.0.1.sslip.io;
    access_log off;
    location / {
        proxy_set_header Host auth.127.0.0.1.sslip.io:18081;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_pass http://verdant-issue11-keycloak:8080;
    }
}
